name: Manual test and deploy (optional)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests and Worker build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run cloud:check

  deploy:
    name: Deploy to Cloudflare
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://personal-intelligence-system.dean-winston.workers.dev
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Configure CLOUDFLARE_API_TOKEN secret and CLOUDFLARE_ACCOUNT_ID variable in repository settings.'
            exit 1
          fi
      - run: npm ci
      - name: Deploy Worker, assets, schedule and workflow
        run: npm run cloud:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Check public application and login protection
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base='https://personal-intelligence-system.dean-winston.workers.dev';
          let failure;
          for(let attempt=0;attempt<6;attempt++) {
            try {
              const page=await fetch(base,{signal:AbortSignal.timeout(15000)});
              assert.equal(page.status,200);
              assert.match(await page.text(),/<title>BanyanResearch<\/title>/);
              const api=await fetch(base+'/api/state',{signal:AbortSignal.timeout(15000)});
              assert.equal(api.status,401,'Private data must require login');
              console.log('Application reachable; private API requires login.');
              process.exit(0);
            } catch(error) { failure=error; await new Promise(resolve=>setTimeout(resolve,5000)); }
          }
          throw failure;
          JS
